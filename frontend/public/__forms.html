<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Earthos Lab</title>
</head>
<body>
  <!-- Netlify Form Detection: Contact / Prototype Capital Inquiry Form -->
  <form name="contact" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="organization" />
    <input type="text" name="interestType" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>

  <!-- Netlify Form Detection: Research Dispatch / Updates Form -->
  <form name="newsletter" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="newsletter" />
    <input type="email" name="email" />
    <input name="bot-field" />
  </form>
</body>
</html>
