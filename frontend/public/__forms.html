<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Earthos Lab</title>
</head>
<body>
  <div style="display: none;">
    <!-- Contact / Prototype Capital Inquiry Form -->
    <form name="contact" method="POST" action="/__forms.html" data-netlify="true" netlify netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organization" />
      <input type="text" name="interestType" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
      <button type="submit">Submit</button>
    </form>

    <!-- Research Dispatch / Updates Form -->
    <form name="newsletter" method="POST" action="/__forms.html" data-netlify="true" netlify netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="newsletter" />
      <input type="email" name="email" />
      <input name="bot-field" />
      <button type="submit">Subscribe</button>
    </form>
  </div>
</body>
</html>
